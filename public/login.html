<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – MediGuard Security</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f8fafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      max-width: 440px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="login-container px-3">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="card-header bg-dark text-white text-center py-4">
        <div class="brand-icon-wrapper mx-auto mb-2" style="width: 50px; height: 50px;">
          <i class="bi bi-shield-plus fs-2 text-white"></i>
        </div>
        <h4 class="fw-bold mb-0">Medi<span class="text-primary">Guard</span></h4>
        <small class="text-white-50">Medicine Expiry & Security Alert System</small>
      </div>

      <div class="card-body p-4">
        <div class="alert alert-info py-2 px-3 small d-flex align-items-center justify-content-between mb-4">
          <div>
            <strong>Demo Admin Credentials:</strong><br>
            User: <code>admin</code> | Pass: <code>admin123</code>
          </div>
          <button type="button" class="btn btn-sm btn-primary fw-semibold" id="fillDemoBtn">
            Auto-fill
          </button>
        </div>

        <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

        <form id="standaloneLoginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Admin Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control" id="username" placeholder="e.g. admin" required autocomplete="username">
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Admin Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="submitBtn">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
          </button>
        </form>
      </div>

      <div class="card-footer bg-light text-center py-3">
        <a href="/#landing" class="text-decoration-none small text-muted">
          <i class="bi bi-arrow-left me-1"></i> Back to Public Landing Page
        </a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('fillDemoBtn').addEventListener('click', () => {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
    });

    document.getElementById('standaloneLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed.');
        }
        window.location.href = '/#dashboard';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
